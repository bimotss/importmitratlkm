[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "import-mitra"
version = "1.0.0"
description = "Import 34 mitra Google Sheets dari VPS, terjadwal dan manual"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "google-auth[requests]>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
import-mitra = "import_mitra.__main__:main"

[tool.setuptools.package-data]
import_mitra = ["dashboard.html"]

[tool.setuptools.packages.find]
include = ["import_mitra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

